name: Validate terms

on:
  push:
    branches: [main]
    paths:
      - "terms/**"
      - "configs/**"
      - "scripts/**"
      - "content/docs/**"
  pull_request:
    paths:
      - "terms/**"
      - "configs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate terms structure
        run: python scripts/validate_terms.py

      - name: Dedupe scan (seed only, report)
        run: python scripts/dedupe_terms.py --seed
