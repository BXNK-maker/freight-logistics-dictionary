# 临时探针：列出当前 API Key 可用的所有 Gemini 模型
name: Probe Gemini models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List models
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=$KEY" \
            | python3 -c "
import json,sys
d=json.load(sys.stdin)
if 'error' in d:
    print('ERROR:', d['error'].get('message'))
for m in d.get('models', []):
    print(m['name'], '|', ','.join(m.get('supportedGenerationMethods', [])))
"
