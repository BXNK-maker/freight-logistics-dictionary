# 每日自动生成词条 → 分块提交 main → 自动部署
# 大批量运行时按块提交，即使任务被中断也已完成的词条不丢失；
# 连续失败时熔断退出（写入 .quota_exhausted 标记），避免空耗重试。
name: Generate dictionary entries

on:
  schedule:
    - cron: "10 7 * * *" # 每天 UTC 07:10（北京时间 15:10，Gemini 免费配额每日重置后）
  workflow_dispatch: # 允许在 Actions 页面手动触发
    inputs:
      max_entries:
        description: "本次最多生成多少条词条（0 = 全部 pending）"
        default: "750"
        required: false

permissions:
  contents: write

concurrency:
  group: generate-entries
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 留 30 分钟余量，低于 GitHub 6 小时硬上限
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate entries in chunks and push
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-latest,gemini-2.5-flash,gemini-2.0-flash-lite,gemini-flash-lite-latest # 逗号分隔模型链：404/429 自动切换（各模型配额独立）
          TOTAL: ${{ github.event.inputs.max_entries || '750' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          total=${TOTAL}
          chunk=100
          batch=0
          while [ "$total" -gt 0 ]; do
            batch=$((batch + 1))
            n=$(( total < chunk ? total : chunk ))
            echo "=== 批次 $batch：生成 $n 条（剩余总目标 $total）==="
            rm -f .quota_exhausted
            MAX_ENTRIES=$n python scripts/generate_entries.py
            total=$(( total - n ))

            if [ -f .quota_exhausted ]; then
              echo "检测到配额熔断标记，停止后续批次。"
              rm -f .quota_exhausted
              git checkout -- . 2>/dev/null || true
              total=0
            fi

            if [ -z "$(git status --porcelain)" ]; then
              echo "本批次无新词条（可能已全部生成完毕），结束。"
              break
            fi

            git add -A
            git commit -m "chore(dict): AI 生成词条批次 $batch" -q
            git pull --rebase origin main -q || git pull --no-rebase origin main -q
            git push origin main -q
            echo "批次 $batch 已提交并推送 ✓"
          done

          echo "=== 完成，剩余 pending 统计 ==="
          python -c "import csv;rows=list(csv.DictReader(open('terms/terms.csv',encoding='utf-8-sig')));p=sum(1 for r in rows if r['status'].strip()=='pending');print('published:', len(rows)-p, '| pending:', p)"
